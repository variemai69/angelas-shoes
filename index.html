<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO Meta Tags για Havaianas, Ipanema & Άλιμο -->
<title>Angelas Shoes | Σαγιονάρες Havaianas & Ipanema στον Άλιμο</title>
<meta name="description" content="Ανακαλύψτε τη μεγάλη συλλογή σε αυθεντικές σαγιονάρες Havaianas και Ipanema στο Angelas Shoes στον Άλιμο. Γυναικεία, ανδρικά και παιδικά σχέδια!">
<meta name="keywords" content="Havaianas, Ipanema, σαγιονάρες, Άλιμος, Angelas Shoes, παπούτσια Άλιμος, καλοκαιρινά σανδάλια">

<style>
    body {
        background-color: #000;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 50px 20px;
    }

    /* Μέγεθος Logo για Υπολογιστή */
    .logo {
        width: 500px;
        max-width: 90%;
        height: auto;
        display: block;
        margin: 0 auto 20px auto; /* Απόσταση από τη λευκή γραμμή (~ένα δάχτυλο) */
    }

    /* Λευκή Γραμμή σε όλο το πλάτος της οθόνης */
    .divider {
        border: none;
        border-top: 1px solid #fff;
        width: calc(100% + 40px); /* Απλώνεται σε όλη την οθόνη ακυρώνοντας το padding του body */
        margin: 0 -20px 30px -20px;
        opacity: 0.8;
    }

    .info {
        font-size: 18px;
        line-height: 1.8;
        max-width: 650px;
        margin: 0 auto;
    }

    .info p {
        margin: 16px 0;
    }

    .construction-note {
        color: #ccc;
        font-weight: bold;
        letter-spacing: 1px;
    }

    a {
        color: #fff;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    /* Ρυθμίσεις για Κινητά */
    @media (max-width: 600px) {
        body {
            padding: 30px 15px;
        }

        .logo {
            width: 340px; 
            max-width: 95%;
            margin-bottom: 15px;
        }

        .divider {
            width: calc(100% + 30px); /* Προσαρμογή για τα περιθώρια του κινητού */
            margin: 0 -15px 25px -15px;
        }

        .info {
            font-size: 16px;
            line-height: 1.7;
        }
    }
</style>
</head>

<body>

    <!-- Λογότυπο -->
    <img src="logo.jpg" alt="Angela's Shoes" class="logo">

    <!-- Ασπρη Γραμμή σε όλο το πλάτος -->
    <hr class="divider">

    <!-- Πληροφορίες & Κείμενο -->
    <div class="info">
        <p class="construction-note">
            Our website is currently under construction.
        </p>

        <p>
            Visit our physical store at 
            <br>
            <a href="https://maps.google.com/?q=Grigoriou+Auxentiou+18,+Alimos+17455,+Greece" target="_blank">
                Grigoriou Auxentiou 18, Alimos 17455, Greece
            </a>
        </p>

        <p>
            For inquiries or more details, call us at 
            <br>
            <a href="tel:+302109956530">
                +30 210 9956530
            </a>
        </p>

        <p>
            Follow us on Instagram 
            <br>
            <a href="https://www.instagram.com/angelas.shoes/" target="_blank">
                @angelas.shoes
            </a>
        </p>
    </div>

</body>
</html>
